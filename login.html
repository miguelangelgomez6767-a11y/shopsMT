<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar Sesión - ShopsMT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <div class="login-card__header">
      <h1>Bienvenido</h1>
      <p>Accede a tu cuenta para seguir comprando en ShopsMT.</p>
    </div>

    <form class="login-form">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" placeholder="nombre@ejemplo.com" required>

      <label for="password">Contraseña</label>
      <input id="password" type="password" placeholder="Ingrese su contraseña" required>

      <div class="login-form__actions">
        <label class="checkbox-label">
          <input type="checkbox">
          Recuérdame
        </label>
        <a href="#" class="link-secondary">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="button-primary">Ingresar</button>
    </form>

    <div class="login-card__footer">
      <p>¿No tienes cuenta?</p>
      <a href="index.html" class="button-secondary">Crear una cuenta</a>
    </div>
  </div>
</div>

</body>
</html>
